<section class="reviews">
  <h2>Customer reviews:</h2>

  <ng-container *ngIf="reviews?.length; else noReviews">
    <article class="review" *ngFor="let r of reviews">
      <fa-icon icon="user"></fa-icon>
      <div class="content">
        <div class="head">
          <strong>{{ r.name }}</strong>
          <span class="stars">{{ r.rate }} <fa-icon icon="star"></fa-icon></span>
        </div>
        <p class="text">{{ r.text }}</p>
      </div>
    </article>
  </ng-container>

  <ng-template #noReviews>
    <p class="muted">No reviews for this product yet.</p>
  </ng-template>
</section>
